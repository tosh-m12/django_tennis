name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          DEBUG: "1"
        run: python manage.py test tennis.tests
      - name: Collect production static files
        env:
          DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
        run: python manage.py collectstatic --noinput
      - name: Check production security settings
        env:
          DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
        run: python manage.py check --deploy
