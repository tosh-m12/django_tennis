{% extends "tennis/base.html" %}
{% block title %}クラブURLの再送 | DeuceNet{% endblock %}
{% block content %}
<div style="max-width:460px;margin:40px auto;">
  <h1 style="font-size:20px;margin:0 0 8px;">クラブのURLを忘れた方</h1>
  <p style="color:#555;margin:0 0 18px;font-size:14px;line-height:1.7;">
    登録済みのメールアドレスを入力すると、クラブのURLをお送りします。
  </p>
  {% if error %}
    <p style="color:#b91c1c;font-size:14px;margin:0 0 12px;">{{ error }}</p>
  {% endif %}
  <form method="post" action="{% url 'tennis:recover' %}">
    {% csrf_token %}
    <input type="email" name="email" placeholder="you@example.com" required
           style="width:100%;height:40px;padding:0 12px;box-sizing:border-box;
                  border:1px solid #cbd5e1;border-radius:8px;font-size:15px;">
    <button type="submit" class="btn" style="margin-top:12px;">送信</button>
  </form>
  <p style="color:#94a3b8;font-size:12px;margin-top:14px;line-height:1.6;">
    登録済みのアドレスにのみお送りします。
  </p>
</div>
{% endblock %}
